; Builds the ready-to-flash firmware (examples/AutoEyes) for any ESP32-S3 board.
; Flash settings are kept at 4MB / no PSRAM so the same image runs on every S3 variant (N4 ... N16R8).
; After each build, tools/merge_bin.py also writes .pio/build/esp32s3/robot-eyes-esp32s3.bin, a single image to
; flash at 0x0 (attached to GitHub releases).

[platformio]
src_dir = examples/AutoEyes
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@7.1.1
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@1.1.16
    symlink://.
extra_scripts = post:tools/merge_bin.py
